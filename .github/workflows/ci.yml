name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # pull_request runs check out GitHub's merge commit, whose first parent is the base branch tip.
  CHANGED: ${{ github.event_name == 'pull_request' && '--since HEAD^1' || '--all' }}

# A new push to a pull request cancels its older run; every push to main runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changed workspaces
    runs-on: ubuntu-latest
    outputs:
      workspaces: ${{ steps.scope.outputs.workspaces }}
      verify-media: ${{ steps.skill.outputs.changed }}
      e2e-groups: ${{ steps.e2e.outputs.groups }}
      ios-bundle: ${{ steps.ios.outputs.bundle }}
      ios-build: ${{ steps.ios.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter=. --ignore-scripts
      - id: scope
        run: |
          workspaces="$(scripts/changed-packages.sh $CHANGED)"
          echo "workspaces=$(jq -Rsc 'split("\n") | map(select(. != ""))' <<<"$workspaces")" >> "$GITHUB_OUTPUT"
      - id: ios
        run: scripts/ios-apps.sh $CHANGED >> "$GITHUB_OUTPUT"
      # The verify-media skill lives outside the workspaces, so its tests key off its own paths.
      - id: skill
        run: |
          if [ "$CHANGED" = "--all" ] || git diff --name-only HEAD^1 HEAD | grep -qE '^(\.agents/skills/verify-media/|scripts/private-network\.sh$|\.github/workflows/ci\.yml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - id: e2e
        run: |
          groups="$(grep -oE 'group: "[^"]+"' apps/web/movies/playwright.config.ts | cut -d'"' -f2 | sort -u)"
          echo "groups=$(jq -Rsc 'split("\n") | map(select(. != ""))' <<<"$groups")" >> "$GITHUB_OUTPUT"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: scope
        run: |
          workspaces="$(scripts/changed-packages.sh $CHANGED)"
          echo "workspaces=$(jq -Rsc 'split("\n") | map(select(. != ""))' <<<"$workspaces")" >> "$GITHUB_OUTPUT"
      - run: scripts/changed-packages.sh $CHANGED typecheck
      - run: scripts/changed-packages.sh $CHANGED lint
      - run: pnpm fmt:check
      - run: pnpm --filter @media/commands check
      - run: pnpm knip
      - run: scripts/check-deploy.sh
      - run: scripts/check-history.sh apps packages scripts nix deploy .agents tools docs README.md AGENTS.md
      - if: contains(fromJSON(steps.scope.outputs.workspaces), 'apps/cli')
        run: pnpm --filter @lmdevv/media build:sea
      - if: contains(fromJSON(steps.scope.outputs.workspaces), 'apps/cli')
        run: test "$(apps/cli/dist/sea/media-linux-x64 --version)" = "$(scripts/check-version.sh)"

  unit:
    name: unit tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The Vitest projects in vitest.config.ts.
        project: [playback, other]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/ffmpeg
      - run: pnpm install --frozen-lockfile
      # Ubuntu's AppArmor refuses unprivileged user namespaces by default; allowing them lets the
      # media service's pid-namespace regression in tool-lifetime.test.ts run instead of skip.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: unshare --user --map-root-user --pid --fork --mount-proc true
      - run: scripts/changed-packages.sh $CHANGED test --project ${{ matrix.project }}

  # scripts/ios-apps.sh scopes both iOS jobs: the bundle job to each app a diff affects, and the
  # build job to the apps whose native code or generated project it can change.
  ios-bundle:
    name: iOS bundle (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.ios-bundle != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.ios-bundle) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The production export fails the job when a module doesn't resolve; its size never does.
      - name: Bundle and its size
        env:
          APP: ${{ matrix.app }}
        run: |
          bytes() { find "apps/mobile/$APP/dist/_expo/static/js/ios" -name "$1" -exec cat {} + | wc -c | tr -d ' '; }
          pnpm --filter "@media/mobile-$APP" bundle
          bytecode="$(bytes '*.hbc')"
          pnpm --filter "@media/mobile-$APP" bundle --no-bytecode
          {
            echo "| $APP iOS bundle | bytes |"
            echo "| --- | ---: |"
            echo "| Hermes bytecode | $bytecode |"
            echo "| JavaScript | $(bytes '*.js') |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # An unsigned Debug build for the simulator: prebuild, CocoaPods, and every native module compile.
  # A Debug simulator build skips the JavaScript bundle, which the bundle job above exports.
  ios-build:
    name: iOS build (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.ios-build != '[]'
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.ios-build) }}
    env:
      APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # The newest released Xcode on the image, as the owner's Mac runs the newest release.
      - run: |
          xcode="$(printf '%s\n' /Applications/Xcode_*.app | grep -E '/Xcode_[0-9.]+\.app$' | sort -V | tail -1)"
          sudo xcode-select --switch "$xcode"
          xcodebuild -version
      # CocoaPods and React Native keep their downloads (pods, the prebuilt React Native core, and
      # Hermes) under a name and version, so an older cache is safe to start from.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/Library/Caches/ReactNative
          key: ios-downloads-${{ matrix.app }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ios-downloads-${{ matrix.app }}-
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter "@media/mobile-$APP" exec expo prebuild --platform ios --clean
      - run: >-
          cd "apps/mobile/$APP/ios" &&
          xcodebuild -workspace "$APP.xcworkspace" -scheme "$APP"
          -configuration Debug -sdk iphonesimulator -destination "generic/platform=iOS Simulator"
          -derivedDataPath "$RUNNER_TEMP/derived-data" ARCHS=arm64 CODE_SIGNING_ALLOWED=NO
          build -quiet

  verify-media-skill:
    name: verify-media skill tests
    needs: changes
    if: needs.changes.outputs.verify-media == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/ffmpeg
      - run: pnpm install --frozen-lockfile --filter=. --ignore-scripts
      - run: pnpm exec playwright install chromium
      # The isolated browser host runs in an unprivileged user and network namespace.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: scripts/private-network.sh true
      - run: node --test .agents/skills/verify-media/scripts/*.test.mjs

  stack:
    name: stack suites against a local Convex (${{ matrix.suite }})
    needs: changes
    if: >-
      contains(fromJSON(needs.changes.outputs.workspaces), 'packages/platform')
      || contains(fromJSON(needs.changes.outputs.workspaces), 'packages/sdk')
      || contains(fromJSON(needs.changes.outputs.workspaces), 'apps/cli')
      || contains(fromJSON(needs.changes.outputs.workspaces), 'apps/media')
    runs-on: ubuntu-latest
    # The platform's files run one at a time within a shard, as their read and write budgets come
    # from the backend's shared function log.
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: platform 1/4
            run: pnpm --filter @media/platform test:stack --shard=1/4
          - suite: platform 2/4
            run: pnpm --filter @media/platform test:stack --shard=2/4
          - suite: platform 3/4
            run: pnpm --filter @media/platform test:stack --shard=3/4
          - suite: platform 4/4
            run: pnpm --filter @media/platform test:stack --shard=4/4
          - suite: SDK and CLI
            run: |
              pnpm --filter @media/sdk test:stack
              pnpm --filter @lmdevv/media test:stack
          - suite: media server
            media: true
            run: pnpm --filter @media/server test:stack
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - if: matrix.media
        uses: ./.github/actions/ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: scripts/dev-stack.sh up
      - if: matrix.media
        run: docker pull jellyfin/jellyfin:12.2@sha256:357724bf0ae27a672c7cbaa899db2d9abeb13dbd8657ccce750258a4c059d037
      - run: ${{ matrix.run }}
        env:
          MEDIA_JELLYFIN_DOCKER: "1"
      - if: always()
        run: scripts/dev-stack.sh destroy

  web-stack:
    name: movies client against a local Convex (${{ matrix.group }})
    needs: changes
    if: >-
      contains(fromJSON(needs.changes.outputs.workspaces), 'apps/web/movies')
      || contains(fromJSON(needs.changes.outputs.workspaces), 'apps/web/account')
      || contains(fromJSON(needs.changes.outputs.workspaces), 'packages/platform')
      || contains(fromJSON(needs.changes.outputs.workspaces), 'apps/media')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.changes.outputs.e2e-groups) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @media/web-movies exec playwright install chromium
      - run: scripts/dev-stack.sh up
      - run: pnpm --filter @media/web-movies exec playwright test
        env:
          E2E_GROUP: ${{ matrix.group }}
          MEDIA_JELLYFIN_DOCKER: "1"
      - name: Time per suite
        if: always() && hashFiles('apps/web/movies/playwright-report/results.json') != ''
        run: |
          {
            echo "| suite | tests | minutes |"
            echo "| --- | ---: | ---: |"
            jq -r '
              [.. | objects | select(has("projectName") and has("results")) | .projectName as $suite
                | .results[] | {suite: $suite, start: (.startTime | sub("\\.[0-9]+Z$"; "Z") | fromdate), ms: .duration}]
              | group_by(.suite)
              | map({suite: .[0].suite, tests: length, seconds: ((map(.start + .ms / 1000) | max) - (map(.start) | min))})
              | sort_by(-.seconds)[]
              | "| \(.suite) | \(.tests) | \(.seconds / 6 | round / 10) |"' apps/web/movies/playwright-report/results.json
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.group }}
          path: apps/web/movies/playwright-report
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results-${{ matrix.group }}
          path: apps/web/movies/test-results
          retention-days: 7
      - if: always()
        run: scripts/dev-stack.sh destroy

  account-stack:
    name: account client against a local Convex
    needs: changes
    if: >-
      contains(fromJSON(needs.changes.outputs.workspaces), 'apps/web/account')
      || contains(fromJSON(needs.changes.outputs.workspaces), 'packages/platform')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @media/web-account exec playwright install chromium
      - run: scripts/dev-stack.sh up
      - run: pnpm --filter @media/web-account exec playwright test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: account-playwright-results
          path: apps/web/account/test-results
          retention-days: 7
      - if: always()
        run: scripts/dev-stack.sh destroy

  music-stack:
    name: music client against a local Convex
    needs: changes
    if: >-
      contains(fromJSON(needs.changes.outputs.workspaces), 'apps/web/music')
      || contains(fromJSON(needs.changes.outputs.workspaces), 'packages/player')
      || contains(fromJSON(needs.changes.outputs.workspaces), 'apps/web/account')
      || contains(fromJSON(needs.changes.outputs.workspaces), 'packages/platform')
      || contains(fromJSON(needs.changes.outputs.workspaces), 'apps/media')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @media/web-music exec playwright install chromium
      - run: scripts/dev-stack.sh up
      - run: pnpm --filter @media/web-music exec playwright test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: music-playwright-results
          path: apps/web/music/test-results
          retention-days: 7
      - if: always()
        run: scripts/dev-stack.sh destroy

  sandbox:
    name: media tests under the NixOS module's system call filter
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.workspaces), 'apps/media')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The runner has no login session, so start a user manager for systemd-run --user.
      - run: |
          sudo loginctl enable-linger "$USER"
          runtime="/run/user/$(id -u)"
          timeout 60 bash -c "until [ -S '$runtime/systemd/private' ]; do sleep 1; done"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
      - run: scripts/check-sandbox.sh

  nix:
    name: Nix package and NixOS module
    needs: changes
    if: >-
      contains(fromJSON(needs.changes.outputs.workspaces), 'apps/media')
      || contains(fromJSON(needs.changes.outputs.workspaces), 'apps/web/movies')
      || contains(fromJSON(needs.changes.outputs.workspaces), 'apps/web/music')
      || contains(fromJSON(needs.changes.outputs.workspaces), 'apps/web/account')
      || contains(fromJSON(needs.changes.outputs.workspaces), 'apps/cli')
      || contains(fromJSON(needs.changes.outputs.workspaces), 'packages/platform')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix flake check -L

  # main requires this check, so a new job goes in `needs`.
  passed:
    name: CI passed
    if: always()
    needs:
      [
        changes,
        check,
        unit,
        ios-bundle,
        ios-build,
        verify-media-skill,
        stack,
        web-stack,
        account-stack,
        music-stack,
        sandbox,
        nix,
      ]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "a job ended $result: $RESULTS" >&2
                exit 1
                ;;
            esac
          done
