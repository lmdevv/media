<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  A style naming a family the image lacks (Arial, most styled subtitles) draws in DejaVu Sans,
  which every pattern ends with, as on the NixOS module: libass falls back to fontconfig's best
  match. A requested family that is there, such as an attached font, still comes first.
-->
<fontconfig>
  <match target="pattern">
    <edit name="family" mode="append_last" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
</fontconfig>
