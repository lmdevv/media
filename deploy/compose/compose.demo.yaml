# The demo library instead of MEDIA_LIBRARY: Creative Commons films, shows, and music in a
# data-only image, mounted read-only at /media/library (Docker 28 or later). From this folder:
#
#   docker compose -f compose.yaml -f compose.demo.yaml up -d
#
# Then add /media/library/Movies as a movies library and /media/library/Shows as a shows library.
# docs/demo-library.md lists what it holds. The reference matches deploy/demo-library/image.
services:
  movies:
    volumes:
      - type: image
        source: ghcr.io/lmdevv/media-demo-library:v1@sha256:3d608156083c7a62aaa8af492fa3fb28702318518752aa66ed4d9701a609888a
        target: /media/library
