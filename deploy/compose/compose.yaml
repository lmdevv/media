# [media] with Docker Compose: the all-in-one image (the core's Convex backend, the media service,
# and the web clients behind one port), plus optional sidecars. From this folder:
#
#   cp .env.example .env        # then set MEDIA_LIBRARY and MEDIA_BASE_URL; see docs/homelab.md
#   docker compose up -d
#
# Open MEDIA_BASE_URL, create the owner account, and add /media/library as a movies library; the
# same sign-in opens movies at MEDIA_BASE_URL/movies. Optional: Intel Quick Sync with
# `-f compose.yaml -f compose.qsv.yaml`; an OpenTelemetry collector with `--profile telemetry`.
# Upgrades: docs/operations.md.
name: media

services:
  media:
    # `latest` is the newest release; pin a version (`:0.1`, `:0.1.2`) or follow `main` for the edge.
    image: ${MEDIA_IMAGE:-ghcr.io/lmdevv/media:latest}
    build:
      context: ../..
      dockerfile: deploy/image/Dockerfile
    restart: unless-stopped
    # s6 in the image stops the media service, which ends open responses 3 s into a stop and then
    # closes its streams, before the Convex backend; it allows them 27 s in all.
    stop_grace_period: 30s
    environment:
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:-http://localhost:8080}
      # User and group the media service runs as; they must be able to read the library.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      MEDIA_TRUSTED_PROXIES: ${MEDIA_TRUSTED_PROXIES:-}
      # Media service settings, set in .env. Empty means the service's default (README.md,
      # Configuration).
      LIBRARY_ROOTS: ${LIBRARY_ROOTS:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      OMDB_API_KEY: ${OMDB_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      HARDWARE_ACCELERATION: ${HARDWARE_ACCELERATION:-}
      QSV_DEVICE: ${QSV_DEVICE:-}
      VAAPI_DEVICE: ${VAAPI_DEVICE:-}
      LIBVA_DRIVER_NAME: ${LIBVA_DRIVER_NAME:-}
      MAX_CONCURRENT_TRANSCODES: ${MAX_CONCURRENT_TRANSCODES:-}
      MAX_CONCURRENT_REMUXES: ${MAX_CONCURRENT_REMUXES:-}
      STREAM_IDLE_SECONDS: ${STREAM_IDLE_SECONDS:-}
      STREAM_BUFFER_AHEAD_SECONDS: ${STREAM_BUFFER_AHEAD_SECONDS:-}
      MIN_FREE_TRANSCODE_MB: ${MIN_FREE_TRANSCODE_MB:-}
      LIBRARY_RECONCILE_MINUTES: ${LIBRARY_RECONCILE_MINUTES:-}
      TRICKPLAY: ${TRICKPLAY:-}
      TRICKPLAY_INTERVAL_SECONDS: ${TRICKPLAY_INTERVAL_SECONDS:-}
      TRICKPLAY_CONCURRENCY: ${TRICKPLAY_CONCURRENCY:-}
      LIBRARY_WATCH: ${LIBRARY_WATCH:-}
      LIBRARY_POLL_SECONDS: ${LIBRARY_POLL_SECONDS:-}
      PROBE_TIMEOUT_SECONDS: ${PROBE_TIMEOUT_SECONDS:-}
      FILE_SCAN_TIMEOUT_SECONDS: ${FILE_SCAN_TIMEOUT_SECONDS:-}
      CACHE_MAX_MB: ${CACHE_MAX_MB:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-}
      LOG_MAX_MB: ${LOG_MAX_MB:-}
    ports:
      - "${MEDIA_BIND:-127.0.0.1}:${MEDIA_PORT:-8080}:8080"
    volumes:
      # Everything to keep, one folder per domain: /data/core (the core's Convex database, its
      # secrets, and nightly backups in /data/core/backups) and /data/movies (the media service's
      # state). An install from before the movies cutover also keeps old movies' database there.
      - media-data:/data
      # Disposable HLS segments. To keep them in memory instead, replace this line with
      #   - { type: tmpfs, target: /transcode, tmpfs: { size: 8g } }
      # sized above MIN_FREE_TRANSCODE_MB (2 GiB) plus a few GB per stream.
      - media-transcode:/transcode
      # Libraries, read-only. Add one line per folder and add /media/<name> as a library.
      - ${MEDIA_LIBRARY:-./library}:/media/library:ro

  # No health check: the collector image holds only its binary, with nothing to probe it from.
  otel-collector:
    profiles: [telemetry]
    image: otel/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro

volumes:
  media-data:
  media-transcode:
